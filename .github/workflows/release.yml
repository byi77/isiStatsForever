name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check TOC version matches the tag
        run: |
          TOC_VERSION="$(sed -n 's/^## Version: *//p' isiStats.toc | tr -d '\r')"
          if [ "v${TOC_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "TOC version ${TOC_VERSION} does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Build zip
        run: |
          mkdir -p dist/isiStats
          cp isiStats.toc *.lua LICENSE dist/isiStats/
          cd dist && zip -r "isiStats-${GITHUB_REF_NAME}.zip" isiStats

      - name: Release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          cat notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "dist/isiStats-${GITHUB_REF_NAME}.zip" --title "isiStats ${GITHUB_REF_NAME}" --notes-file notes.md
