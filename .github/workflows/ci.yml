name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install StyLua (same version as local)
        run: cargo install stylua --version 2.6.0 --locked

      - name: StyLua (check)
        run: stylua --check *.lua tools/*.lua

      - name: Install Lua and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: luacheck
        run: luacheck *.lua

      - name: Locale check
        run: lua5.1 tools/check_locale.lua

      - name: Load test
        run: |
          lua5.1 tools/load_test.lua . deDE
          lua5.1 tools/load_test.lua . enUS

      - name: Class matrix
        run: |
          lua5.1 tools/class_matrix.lua . deDE
          lua5.1 tools/class_matrix.lua . enUS
